name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

      - name: Manifests parse and agree
        run: |
          python -c "import json; json.load(open('plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python -m pytest -q tests/test_manifests.py

      - name: Launchers are executable
        run: test -x bin/telegram && test -x bin/telegram-login

      - name: Absence guards (removed runtime, social side effects)
        run: python -m pytest -q tests/test_security_tooling.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Static security checks
        run: ./scripts/security-check.sh
