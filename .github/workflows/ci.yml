name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

      # The suite above already covers the manifests, the launchers and the absence
      # guards. This checks only what pytest cannot: that the manifests are valid
      # JSON to something other than the test that reads them.
      - name: Manifests are well-formed JSON
        run: |
          python -c "import json; json.load(open('plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Static security checks
        run: ./scripts/security-check.sh
